name: Build and Deploy to SiteGround

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: |
          rm -rf dist
          npm run build
          # Keep backwards-compatible copies for any recently cached HTML referencing previous hashes
          JS_FILE=$(ls dist/assets/index-*.js | head -n 1)
          CSS_FILE=$(ls dist/assets/index-*.css | head -n 1)
          for h in index-CUtWghPl.js index-CdzlZzyx.js index-BgkBzKTE.js; do
            if [ -n "$JS_FILE" ] && [ "$JS_FILE" != "dist/assets/$h" ]; then
              cp "$JS_FILE" "dist/assets/$h"
            fi
          done
          for c in index-DAPCCZgl.css index-Cn7MURdL.css index-BPtYGBU1.css; do
            if [ -n "$CSS_FILE" ] && [ "$CSS_FILE" != "dist/assets/$c" ]; then
              cp "$CSS_FILE" "dist/assets/$c"
            fi
          done

      - name: Deploy dist/ to SiteGround via SSH
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          if [ -z "$SG_HOST" ] || [ -z "$SG_USER" ] || [ -z "$SG_SSH_KEY" ] || [ -z "$SG_PATH" ]; then
            echo "SiteGround secrets are not fully configured yet. Skipping SSH deploy."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SG_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          TARGET_PATH="${SG_PATH%/}/"
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -p 18765 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/ "${SG_USER}@${SG_HOST}:${TARGET_PATH}"
          # Flush SiteGround Dynamic Cache via official Site Tools Unix socket (/chroot/tmp/site-tools.sock)
          ssh -i ~/.ssh/id_ed25519 -p 18765 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${SG_USER}@${SG_HOST}" '
            php -r '\''
              foreach (["/chroot/tmp/site-tools.sock", "/tmp/site-tools.sock"] as $sock) {
                if (file_exists($sock)) {
                  foreach (["louisdumas.com", "louisdumas.ca"] as $domain) {
                    $fp = @stream_socket_client("unix://" . $sock, $errno, $errstr, 5);
                    if ($fp) {
                      $req = [
                        "api" => "domain-all",
                        "cmd" => "update",
                        "params" => ["flush_cache" => "1", "id" => $domain, "path" => "/(.*)"],
                        "settings" => ["json" => 1]
                      ];
                      fwrite($fp, json_encode($req, JSON_FORCE_OBJECT) . "\n");
                      $res = fgets($fp, 32768);
                      echo "Flushed $domain via $sock: $res\n";
                      fclose($fp);
                    }
                  }
                }
              }
            '\'' || true
          '
